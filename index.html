
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vice City | Open World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="boot">
        VICE CITY
        <small>OPEN WORLD EXPERIENCE</small>
    </div>

    <div id="ui">

        <div class="logo">
            VICE CITY
            <small>ROLEPLAY</small>
        </div>

        <div class="top">
            <div id="stars">☆☆☆☆☆</div>
            <b>$ 24,873</b>
        </div>

        <div class="mission">
            <small>MISSION</small>
            <strong>Free Roam</strong>
            <p>Explore the city. Find a vehicle.</p>
        </div>

        <div class="help">
            WASD Move / Drive<br>
            Mouse Look<br>
            F Enter / Exit vehicle<br>
            SHIFT Sprint<br>
            SPACE Brake
        </div>

        <canvas id="map" width="160" height="160"></canvas>

        <div id="msg">Welcome to Vice City</div>

    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
